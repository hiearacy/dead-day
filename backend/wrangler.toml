name = "dead-day-gemini-proxy"
main = "src/index.js"
compatibility_date = "2026-10-28"
workers_dev = true

[vars]
GEMINI_MODEL = "gemini-2.5-flash-lite"

# Approximate edge rate limiting for a private prototype, NOT a worldwide
# quota guarantee. Public release needs authenticated users and stricter limits.
[[ratelimits]]
name = "DEMO_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 6
period = 60
