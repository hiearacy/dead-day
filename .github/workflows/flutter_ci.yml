name: Flutter Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Web runners
        run: flutter create --project-name dead_day --platforms=android,web .
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Web
        run: flutter build web --release
      - name: Build Android APK
        run: flutter build apk --debug
