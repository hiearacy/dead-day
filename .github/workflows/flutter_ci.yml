name: Flutter Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gemini-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Gemini proxy without real API key
        run: node --test backend/test/*.test.mjs

  android-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Web runners
        run: flutter create --project-name dead_day --platforms=android,web .
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Web
        run: flutter build web --release
      - name: Upload Web build for playtesting
        uses: actions/upload-artifact@v4
        with:
          name: dead-day-web
          path: build/web/
          retention-days: 7
          if-no-files-found: error
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Upload Android APK for playtesting
        uses: actions/upload-artifact@v4
        with:
          name: dead-day-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
